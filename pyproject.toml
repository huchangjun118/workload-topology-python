[project]
name = "workload-topology-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
# Every coroutine test is executed as an asyncio test automatically;
# no @pytest.mark.asyncio decorator is needed, and no async test can be
# silently collected as a skipped/noop function.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Strict marker/config handling so a typo cannot silently disable a test;
# the "skip counts as failure" rule itself is enforced in tests/conftest.py.
addopts = "-ra --strict-markers --strict-config"
# Surface resource leaks (e.g. a coroutine that was never awaited after a
# cancellation) as errors instead of a warning that is easy to miss.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
